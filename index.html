<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>Login</title>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-3 text-light">
    <div class="card-login p-4 rounded-4 shadow">
        <h1 class="fs-2 fw-bold text-center mb-4">Login</h1>

        <div class="row justify-content-center">
            <form class="needs-validation" novalidate>

                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuário ou E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text" id="icon-usuario">
                            <i class="bx bxs-user"></i>
                        </span>
                        <input type="text" class="form-control" id="usuario" placeholder="Usuário ou E-mail.">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text" id="icon-senha">
                            <i class="bx bxs-lock-alt"></i>
                        </span>
                        <input type="password" class="form-control" id="password" placeholder="Digite sua senha..."
                            aria-describedby="icon-senha" required>
                    </div>
                </div>


                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="lembrar">
                    <label for="lembrar" class="form-check-label">Lembrar senha</label>
                </div>

                <button type="submit" class="btn btn-light w-100 fw-bold mb-3">Login</button>

                <div class="text-center">
                    <p class="mb-0">Não tem uma conta? <a href="#"
                            class="text-white fw-bold decoration-none">Cadastre-se</a></p>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
